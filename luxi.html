<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>留心音乐定制歌曲</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .player {
      width: 360px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .player img {
      width: 100%;
      height: auto;
      border-radius: 15px;
    }

    .player h1 {
      margin: 15px 0 5px;
      font-size: 22px;
      color: #333;
    }

    .player p {
      color: #888;
      margin-bottom: 15px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="player">
    <img src="https://i.postimg.cc/pVBLnW9c/IMG-4470.jpg" alt="封面">
    <h1>soft like butter</h1>
    <p>charlie</p>
    <audio controls>
      <source src="https://disturbed-cyan-pzyh2bnd.edgeone.dev" type="audio/mpeg">
    </audio>
  </div>
</body>
</html>
